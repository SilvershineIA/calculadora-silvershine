<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SilverShine — la calculadora ahora vive en el CRM</title>
<meta name="theme-color" content="#FAF8F6">
<link rel="manifest" href="manifest.json">
<style>
  body{
    font-family:"Segoe UI",system-ui,sans-serif;
    background:#FAF8F6;color:#343D48;
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;margin:0;text-align:center;padding:20px;
  }
  .caja{max-width:420px}
  h1{color:#B07F74;font-size:1.4rem}
  p{color:#6B7280;line-height:1.6}
  a.boton{
    display:inline-block;margin-top:14px;padding:12px 26px;
    background:#343D48;color:#FAF8F6;text-decoration:none;
    border-radius:100px;font-weight:600;
  }
  a.clasica{display:block;margin-top:18px;font-size:.85rem;color:#B07F74}
</style>
</head>
<body>
<div class="caja">
  <h1>✨ La calculadora se mudó</h1>
  <p>Ahora vive dentro de la app de SilverShine, junto a las facturas, cotizaciones y cobros. Te llevamos automáticamente…</p>
  <a class="boton" href="CRM-SilverShine/">Abrir la app SilverShine</a>
  <a class="clasica" href="calculadora-clasica.html">ver la calculadora clásica</a>
</div>
<script>
  // Soltar el service worker viejo y redirigir
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister())).catch(() => {});
  }
  setTimeout(() => { location.href = 'CRM-SilverShine/'; }, 1800);
</script>
</body>
</html>
